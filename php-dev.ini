; Dev-only PHP overrides for textbook PDF uploads.

; Chunked uploads send 8–16 MB per HTTP request; these limits also support legacy single-shot uploads.

; Applied via -d flags in scripts/serve-dev.ps1.

;

; post_max_size must be larger than upload_max_filesize.

upload_max_filesize = 1100M

post_max_size = 1200M

memory_limit = 512M

max_execution_time = 300

max_input_time = 300

